name: Cloudflare backup
concurrency:
  group: cloudflare-production-backup
  cancel-in-progress: false
on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * *'
jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: production
    if: ${{ vars.NODOBITO_API_BASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Export database and private images
        run: npm run backup:cloudflare --workspace @nodobito/api -- --output ../../backups/cloudflare/latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
          API_BASE_URL: ${{ vars.NODOBITO_API_BASE_URL }}
          BACKUP_ADMIN_KEY: ${{ secrets.NODOBITO_BACKUP_ADMIN_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflare-backup
          path: backups/cloudflare/latest
          retention-days: 7
